  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1e5c38; }

    /* L'Iframe prend tout l'écran en arrière-plan */
    iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
      z-index: 1;
      display: none; /* Caché pendant le splash */
    }

    /* SPLASH SCREEN (ton design actuel) */
    #splash {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1e5c38;
      color: #fff;
      font-family: -apple-system, sans-serif;
      transition: opacity 0.8s ease-out;
    }

    /* On garde tes styles d'animation ici... */
    .logo-wrap { position: relative; width: 100px; height: 100px; margin-bottom: 20px; }
    .logo-ring { position: absolute; inset: -8px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: #52b788; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.6rem; text-align: center; }
    h1 span { color: #4ade80; }
    .progress-wrap { width: 180px; height: 3px; background: rgba(255,255,255,.1); border-radius: 10px; margin-top: 20px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: #4ade80; animation: load 3s forwards; }
    @keyframes load { to { width: 100%; } }
  </style>
</head>
<body>

  <div id="splash">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#1a3a22"/><line x1="50" y1="76" x2="50" y2="28" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/><path d="M50 60 C26 50 16 30 26 16 C33 7 47 14 50 32 Z" fill="#22c55e"/><path d="M50 46 C74 36 82 14 72 3 C65 -4 51 5 50 24 Z" fill="#16a34a"/>
      </svg>
    </div>
    <h1>Ma Serre<br><span>Connectée</span></h1>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
  </div>

  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbyXfXtiLTgRRQfluQq1tzUfEuEISlyK8J6y01VwLratOn4aKF8H--W_PiIjkB5x4KO5Bg/exec"></iframe>

  <script>
    const iframe = document.getElementById('appFrame');
    const splash = document.getElementById('splash');

    // Dès que l'iframe a fini de charger le script Google
    iframe.onload = function() {
      setTimeout(() => {
        splash.style.opacity = '0';
        iframe.style.display = 'block';
        setTimeout(() => splash.remove(), 800);
      }, 2500); // Temps de sécurité pour l'animation
    };
  </script>
</body>
