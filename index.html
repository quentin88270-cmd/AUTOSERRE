  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Outfit', sans-serif;
      background: #1e5c38;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* ── FOND animé ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 40%, #2d7a4f66, transparent),
        radial-gradient(ellipse 60% 60% at 80% 70%, #16a34a33, transparent);
      animation: bg-breathe 6s ease-in-out infinite alternate;
    }
    @keyframes bg-breathe {
      from { opacity: .7; }
      to   { opacity: 1; }
    }

    /* ── CONTENU ── */
    .splash {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      text-align: center;
      padding: 40px 30px;
      animation: appear .5s ease both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── LOGO ── */
    .logo-wrap {
      position: relative;
      width: 100px; height: 100px;
    }
    .logo-ring {
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #52b788;
      border-right-color: #52b78855;
      animation: spin 1.1s linear infinite;
    }
    .logo-ring-2 {
      position: absolute; inset: -16px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-bottom-color: #4ade8033;
      animation: spin 2.2s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-wrap svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,.3));
      animation: logo-pulse 3s ease-in-out infinite;
    }
    @keyframes logo-pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* ── TEXTE ── */
    h1 {
      font-size: 1.6rem; font-weight: 800;
      letter-spacing: -.5px; line-height: 1.1;
    }
    h1 span { color: #4ade80; }

    .sub {
      font-size: .82rem; opacity: .65;
      letter-spacing: .5px; font-weight: 300;
    }

    /* ── BARRE DE PROGRESSION ── */
    .progress-wrap {
      width: 180px; height: 3px;
      background: rgba(255,255,255,.15);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4ade80, #86efac);
      border-radius: 10px;
      animation: load 2.2s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes load {
      0%   { width: 0%; }
      40%  { width: 60%; }
      80%  { width: 85%; }
      100% { width: 100%; }
    }

    .redirect-msg {
      font-size: .72rem;
      opacity: .5;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }
  </style>
</head>

<div class="splash">

  <!-- Logo -->
  <div class="logo-wrap">
